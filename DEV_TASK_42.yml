    - "Keyboard-only flow test: create session, send message, edit a section, save draft, open override dialog and cancel"
    - "Fix all serious/critical axe violations in components"
  out:
    - "Full WCAG audit beyond automated checks and the keyboard flow"

files:
  "tests/e2e/a11y.spec.ts": "create"
  "src/components/**": "update as needed to fix violations"
  "package.json": "add @axe-core/playwright"

implementation_notes: |
  Conventions: Playwright suite and mocks from task 39 (npm run test:e2e); Tailwind components in src/components.
  Configure axe with tags wcag2a, wcag2aa, wcag21a, wcag21aa. Fail on 'serious' or 'critical' impact.

acceptance_criteria:
  - id: AC1
    behavior: "axe reports zero serious/critical violations on every listed page/state"
    verify: "npm run test:e2e -- a11y"
  - id: AC2
