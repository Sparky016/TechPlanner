# Production example: one image, three roles. See docs/runbook.md.
#
#   docker build -t techplanner .
#   docker compose --env-file prod.env -f docker-compose.prod.example.yml up -d
#
# MySQL 8.4 runs natively on the hosting server, not in a container (docs/runbook.md §7). The containers reach it
# through host.docker.internal, which host-gateway maps to the Docker bridge gateway; MySQL must listen there.
# Order is enforced by depends_on: migrate (one-shot) completes -> worker and web start.
# Credentials: web and worker get the restricted app user (DATABASE_URL). Only migrate gets the owner user
# (MIGRATE_DATABASE_URL, passed to it as DATABASE_URL) and APP_DB_USER, the grantee of the per-table grants.
# Required variables use ${VAR:?}: compose refuses to start without them, and no secret has a default here.

name: techplanner-prod

x-app-env: &app-env
  ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:?}
  ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:?}
  ATLASSIAN_CLOUD_ID: ${ATLASSIAN_CLOUD_ID:?}
  OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:?}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
  APP_BASE_URL: ${APP_BASE_URL:?}
  COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:?}
  FACILITATOR_MODEL: ${FACILITATOR_MODEL:?}
  EVALUATOR_MODEL: ${EVALUATOR_MODEL:?}
  CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-150000}
  CONFLUENCE_SPACE_KEY: ${CONFLUENCE_SPACE_KEY:?}
  CONFLUENCE_PARENT_PAGE_ID: ${CONFLUENCE_PARENT_PAGE_ID:?}
  CONFLUENCE_PROJECT_OVERRIDES: ${CONFLUENCE_PROJECT_OVERRIDES:-}
  DOWNSTREAM_WEBHOOK_URL: ${DOWNSTREAM_WEBHOOK_URL:-}
  DOWNSTREAM_WEBHOOK_SECRET: ${DOWNSTREAM_WEBHOOK_SECRET:-}
  SECTION_WEIGHTS: ${SECTION_WEIGHTS:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # '1' only for smoke tests without a Copilot-entitled token; never in production.
  LLM_FAKE: ${LLM_FAKE:-0}

services:
  migrate:
    image: ${TECHPLANNER_IMAGE:-techplanner}
    environment:
      <<: *app-env
      ROLE: migrate
      # Owner user (DDL). Present in this service only; web and worker never see it.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?}
      # Must equal the 'user'@'host' the app user was created with (e.g. 'techplanner_app'@'172.17.%').
      APP_DB_USER: ${APP_DB_USER:?}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'

  worker:
    image: ${TECHPLANNER_IMAGE:-techplanner}
    environment:
      <<: *app-env
      ROLE: worker
      DATABASE_URL: ${DATABASE_URL:?}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${TECHPLANNER_IMAGE:-techplanner}
    environment:
      <<: *app-env
      ROLE: web
      DATABASE_URL: ${DATABASE_URL:?}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: unless-stopped
