id: csv-import
domain: crm
ticket:
  key: CRM-88
  summary: Bulk import contacts from CSV
  description: |
    Sales teams want to upload a CSV of contacts (name, email, company, phone) instead of entering them one by one.
    Duplicates by email should update the existing contact.
  comments:
    - author: Joy (Support)
      body: Customers often export from Excel with odd encodings.
draft:
  Problem Statement: Manual contact entry is slow for sales teams.
  Scope: CSV upload creating or updating contacts by email.
  Functional Requirements: |
    - Upload a CSV with name, email, company, phone.
    - Existing email updates the contact.
  Technical Design: Upload to object storage, process in a background job.
  Error Handling: Bad rows should be handled gracefully.
  Acceptance Criteria: |
    - Uploading a 100-row valid CSV creates 100 contacts.
seededCriticalGaps:
  - id: file-limits
    section: Non-functional Requirements
    keywords: [file size, row limit, maximum rows, max size, large file]
  - id: import-result-report
    section: User Flows
    keywords: [error report, which rows, row errors, import summary]
vagueStatements:
  - section: Error Handling
    text: Bad rows should be handled gracefully.
replies:
  - Phone numbers should be stored in E.164 format.
  - That's not decided. What else?
