    section: Acceptance Criteria
    keywords: [acceptance criteria, definition of done, how will we verify, done when]
  - id: approver-unavailable
    section: Error Handling
    keywords: [delegate, out of office, escalat, no manager, unavailable]
vagueStatements:
  - section: Non-functional Requirements
    text: The approval experience should be smooth.
replies:
